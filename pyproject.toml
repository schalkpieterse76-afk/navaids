[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "navaids"
version = "1.0.0"
description = "Navigational Aids (Navaids) management and query tool for aviation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["aviation", "navaids", "VOR", "NDB", "ILS", "DME", "navigation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
navaids = "navaids.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["navaids*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
